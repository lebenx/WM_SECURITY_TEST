  </g>
  <g id="text_34">
   <text style="fill: #434c55; font: 7.5px 'DejaVu Sans'" transform="translate(122.435469 210.910312)">One shared query; two post hoc selected means; fixed 30-control open-loop outcomes.</text>
   <text style="fill: #434c55; font: 7.5px 'DejaVu Sans'" transform="translate(108.276875 219.308672)">True-future scoring is restricted to this bank, not a full oracle planner. No population inference.</text>
  </g>
 </g>
